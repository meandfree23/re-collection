name: Daily Curated Spatial Journal Auto-Update

on:
  schedule:
    # Runs every day at 00:30 UTC (09:30 KST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-curation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests deep-translator

      - name: Execute Daily Curated Scraping
        run: |
          python daily_collector.py
          mkdir -p docs/data
          cp data/daily_archive.json docs/data/daily_archive.json

      - name: Commit and Push Updated Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_archive.json docs/data/daily_archive.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 24/7 Daily Curated Spatial & Media Journal [skip ci]" && git push origin master)
