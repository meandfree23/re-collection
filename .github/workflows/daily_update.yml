name: Daily Curated Spatial Journal Auto-Update

on:
  schedule:
    # Runs 3 times a day:
    # 1. Early Morning 06:30 KST (21:30 UTC)
    - cron: '30 21 * * *'
    # 2. Morning 09:30 KST (00:30 UTC)
    - cron: '30 0 * * *'
    # 3. Afternoon 14:30 KST (05:30 UTC)
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-curation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests deep-translator

      - name: Execute Daily Curated Scraping & Compile Pages
        run: |
          python daily_collector.py
          python build_pages.py

      - name: Commit and Push Updated Journal (Triggers Pages Build)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update: Daily Curated Spatial & Media Journal ($GITHUB_RUN_NUMBER)" && git push origin master)
