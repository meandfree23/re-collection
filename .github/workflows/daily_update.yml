name: Daily Curated Spatial Journal Auto-Update

on:
  schedule:
    # Robust Off-Peak Multi-Shift Schedule (Zero Platform Jam):
    # 1. Early Dawn 06:18 KST (21:18 UTC) — Fresh daily feed ready before waking up
    - cron: '18 21 * * *'
    # 2. Breakfast Golden Hour 07:32 KST (22:32 UTC) — Second dawn supplement
    - cron: '32 22 * * *'
    # 3. Morning Start 08:43 KST (23:43 UTC) — Morning supplement before work starts
    - cron: '43 23 * * *'
    # 4. Mid-day Refresh 11:27 KST (02:27 UTC) — European morning releases
    - cron: '27 2 * * *'
    # 5. Late Afternoon 17:14 KST (08:14 UTC) — Evening wrap-up
    - cron: '14 8 * * *'
    # 6. Night Wrap 21:30 KST (12:30 UTC) — Global night digest
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 실행이 겹치면 뒤 실행이 기다린다(동시 push 충돌 방지)
concurrency:
  group: re-collection-daily
  cancel-in-progress: false

env:
  TZ: 'Asia/Seoul'

jobs:
  daily-curation:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests deep-translator

      - name: Execute Daily Curated Scraping
        run: |
          python daily_collector.py

      - name: Run 5-Layer Self-Healing Guardian (Zero-Defect Gate)
        run: |
          python self_heal_guardian.py

      - name: Generate Weekly Zeitgeist Report (free keyword-frequency engine)
        run: |
          python zeitgeist_engine.py

      - name: Deep Read (원문 정독 + 외부 리서치 + 한국어 헤드라인/설명 + 큐레이터 인사이트, free Gemini flash-lite)
        continue-on-error: true
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }},${{ secrets.GEMINI_API_KEY_2 }}
          DEEP_MAX_ITEMS: '120'
          DEEP_TIME_BUDGET: '1500'
          DEEP_MAX_NOTES: '4'
        run: |
          python deep_reader.py

      - name: Compile Pages & Generate Static Partitions
        run: |
          python build_pages.py

      - name: Commit and Push Updated Journal (Triggers Pages Build)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Auto-update: Daily Curated Spatial & Media Journal ($GITHUB_RUN_NUMBER)"
          # 실행 중에 다른 커밋이 들어왔으면 그 위에 얹어서 올린다
          for i in 1 2 3; do
            git push origin master && exit 0
            git pull --rebase -X theirs origin master || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Run Summary (자가 진단)
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, glob
          from datetime import datetime, timezone, timedelta
          today = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d')
          deep = json.load(open('data/deep_reads.json', encoding='utf-8')) if os.path.exists('data/deep_reads.json') else {}
          import deep_reader as dr
          rows = []
          for fp in sorted(glob.glob('data/daily/*.json'), reverse=True)[:7]:
              items = json.load(open(fp, encoding='utf-8'))
              ks = [dr.url_key(x.get('url', '')) for x in items]
              ready = sum(1 for k in ks if k in deep)
              researched = sum(1 for k in ks if (deep.get(k) or {}).get('v', 0) >= dr.VERSION)
              rows.append(f"| {os.path.basename(fp)[:-5]} | {len(items)} | {ready} | {researched} |")
          pending = sum(1 for v in deep.values() if v.get('v', 0) < dr.VERSION)
          print(f"### RE:COLLECTION 실행 요약 ({today})")
          print("| 호 | 수집 | 정독 완료 | 리서치 v2 |")
          print("|---|---|---|---|")
          print("\n".join(rows))
          print(f"\n리서치 v2 업그레이드 대기: {pending}건")
          PY
