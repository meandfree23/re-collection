name: Daily Curated Spatial Journal Auto-Update

on:
  schedule:
    # Off-Peak Morning & Daytime Schedule (Avoiding :00 and :30 minute traffic jams):
    # 1. Early Dawn 06:18 KST (21:18 UTC) — Fresh daily feed ready before waking up
    - cron: '18 21 * * *'
    # 2. Morning Start 08:43 KST (23:43 UTC) — Morning supplement before work starts
    - cron: '43 23 * * *'
    # 3. Mid-day Refresh 11:27 KST (02:27 UTC) — European morning releases
    - cron: '27 2 * * *'
    # 4. Late Afternoon 17:14 KST (08:14 UTC) — Evening wrap-up
    - cron: '14 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: 'Asia/Seoul'

jobs:
  daily-curation:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests deep-translator

      - name: Execute Daily Curated Scraping
        run: |
          python daily_collector.py

      - name: Run 5-Layer Self-Healing Guardian (Zero-Defect Gate)
        run: |
          python self_heal_guardian.py

      - name: Compile Pages & Generate Static Partitions
        run: |
          python build_pages.py

      - name: Commit and Push Updated Journal (Triggers Pages Build)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update: Daily Curated Spatial & Media Journal ($GITHUB_RUN_NUMBER)" && git push origin master)
